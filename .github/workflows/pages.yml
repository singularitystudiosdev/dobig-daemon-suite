name: Deploy to GitHub Pages

# Publishes the frontend as a static site. Pages cannot run the local server in server/**, so this build is the
# interface preview: every tool's dashboard explains how to run the real thing (see src/pages/StaticPreview.tsx).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the static preview
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_STATIC_PREVIEW: '1'
          # The hosted server's https URL (repository variable API_BASE). Empty keeps the read-only preview.
          VITE_API_BASE: ${{ vars.API_BASE }}
      # Routes are hash based, so any other path only needs to land on the app.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
